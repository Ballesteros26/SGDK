name: Build SGDK for Windows  
  
on:  
  push:  
    branches: [master]  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
  
      - name: Set up Java for rescomp.jar  
        uses: actions/setup-java@v4  
        with:  
          distribution: temurin  
          java-version: "17"  
  
      - name: Set GDK environment variables  
        run: echo "GDK=${{ github.workspace }}" | Out-File -FilePath $env:GITHUB_ENV -Append  
  
      - name: Clean previous build  
        run: bin\make.exe -f makelib.gen clean  
  
      - name: Build SGDK library  
        run: bin\make.exe -f makelib.gen release  
  
      - name: Upload libmd.a artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: sgdk-libmd  
          path: lib/libmd.a
